<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMR Bot — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0a0a0f;
    --surface:  #111118;
    --border:   #1e1e2e;
    --text:     #e2e2f0;
    --muted:    #5a5a7a;
    --accent:   #4f8ef7;
    --green:    #3dd68c;
    --red:      #f75c5c;
    --amber:    #f7a84f;
    --font-mono: 'IBM Plex Mono', monospace;
    --font-sans: 'IBM Plex Sans', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 14px;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 32px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .logo {
    font-family: var(--font-mono);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--accent);
  }
  .logo span { color: var(--muted); }
  .status-pill {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 2px;
    background: rgba(61,214,140,0.1);
    color: var(--green);
    border: 1px solid rgba(61,214,140,0.2);
  }

  /* ── Layout ── */
  main { padding: 32px; max-width: 1200px; margin: 0 auto; }

  /* ── Stats row ── */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 32px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 20px 24px;
    position: relative;
    overflow: hidden;
  }
  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
  }
  .stat-card.total::before  { background: var(--accent); }
  .stat-card.verified::before { background: var(--green); }
  .stat-card.pending::before  { background: var(--amber); }
  .stat-card.banned::before   { background: var(--red); }

  .stat-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .stat-value {
    font-family: var(--font-mono);
    font-size: 36px;
    font-weight: 600;
    line-height: 1;
  }
  .stat-card.total .stat-value   { color: var(--accent); }
  .stat-card.verified .stat-value{ color: var(--green); }
  .stat-card.pending .stat-value { color: var(--amber); }
  .stat-card.banned .stat-value  { color: var(--red); }

  /* ── Table section ── */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .section-title {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .search-box {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 7px 14px;
    outline: none;
    width: 240px;
    transition: border-color 0.15s;
  }
  .search-box:focus { border-color: var(--accent); }
  .search-box::placeholder { color: var(--muted); }

  /* ── Table ── */
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    overflow-x: auto;
  }
  table { width: 100%; border-collapse: collapse; }
  thead tr {
    border-bottom: 1px solid var(--border);
    background: rgba(255,255,255,0.02);
  }
  th {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 12px 16px;
    text-align: left;
    font-weight: 400;
  }
  td {
    padding: 13px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    vertical-align: middle;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.02); }

  .mono { font-family: var(--font-mono); font-size: 12px; }
  .text-muted { color: var(--muted); }

  /* ── Status badge ── */
  .badge {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    padding: 3px 8px;
    border-radius: 2px;
    text-transform: uppercase;
    font-weight: 600;
  }
  .badge-verified { background: rgba(61,214,140,0.12); color: var(--green); border: 1px solid rgba(61,214,140,0.2); }
  .badge-pending  { background: rgba(247,168,79,0.12);  color: var(--amber); border: 1px solid rgba(247,168,79,0.2); }
  .badge-banned   { background: rgba(247,92,92,0.12);   color: var(--red);   border: 1px solid rgba(247,92,92,0.2); }

  /* ── Action buttons ── */
  .actions { display: flex; gap: 6px; }
  .btn {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    padding: 5px 10px;
    border: 1px solid;
    background: transparent;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.15s;
  }
  .btn-verify { color: var(--green); border-color: rgba(61,214,140,0.3); }
  .btn-verify:hover { background: rgba(61,214,140,0.1); }
  .btn-ban    { color: var(--red);   border-color: rgba(247,92,92,0.3); }
  .btn-ban:hover    { background: rgba(247,92,92,0.1); }
  .btn-unban  { color: var(--amber); border-color: rgba(247,168,79,0.3); }
  .btn-unban:hover  { background: rgba(247,168,79,0.1); }

  /* ── Pagination ── */
  .pagination {
    display: flex;
    justify-content: flex-end;
    gap: 6px;
    margin-top: 16px;
  }
  .page-btn {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 5px 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }
  .page-btn:hover, .page-btn.active {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ── Toast ── */
  #toast {
    position: fixed;
    bottom: 24px; right: 24px;
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 10px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--green);
    color: var(--text);
    opacity: 0;
    transform: translateY(8px);
    transition: all 0.2s;
    pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast.error { border-left-color: var(--red); }

  /* ── Empty state ── */
  .empty {
    text-align: center;
    padding: 48px;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 12px;
  }

  /* ── Refresh button ── */
  .btn-refresh {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 6px 14px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    transition: all 0.15s;
  }
  .btn-refresh:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>

<header>
  <div class="logo">CMR<span>//</span>ADMIN</div>
  <div style="display:flex; align-items:center; gap:16px;">
    <span id="last-updated" style="font-family:var(--font-mono);font-size:11px;color:var(--muted)"></span>
    <div class="status-pill">● LIVE</div>
  </div>
</header>

<main>

  <!-- Stats -->
  <div class="stats">
    <div class="stat-card total">
      <div class="stat-label">Total Users</div>
      <div class="stat-value" id="stat-total">—</div>
    </div>
    <div class="stat-card verified">
      <div class="stat-label">Verified</div>
      <div class="stat-value" id="stat-verified">—</div>
    </div>
    <div class="stat-card pending">
      <div class="stat-label">Pending</div>
      <div class="stat-value" id="stat-pending">—</div>
    </div>
    <div class="stat-card banned">
      <div class="stat-label">Banned</div>
      <div class="stat-value" id="stat-banned">—</div>
    </div>
  </div>

  <!-- Users table -->
  <div class="section-header">
    <span class="section-title">Users</span>
    <div style="display:flex;gap:10px;align-items:center;">
      <input class="search-box" type="text" id="search" placeholder="Search username or name...">
      <button class="btn-refresh" onclick="loadAll()">Refresh</button>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Telegram ID</th>
          <th>Name</th>
          <th>Username</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="users-body">
        <tr><td colspan="5" class="empty">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="pagination" id="pagination"></div>

</main>

<div id="toast"></div>

<script>
  let currentPage = 1;
  let searchTimer = null;

  async function loadStats() {
    try {
      const r = await fetch('/admin/api/stats');
      const d = await r.json();
      document.getElementById('stat-total').textContent    = d.total;
      document.getElementById('stat-verified').textContent = d.verified;
      document.getElementById('stat-pending').textContent  = d.pending;
      document.getElementById('stat-banned').textContent   = d.banned;
    } catch(e) { console.error(e); }
  }

  async function loadUsers(page = 1, search = '') {
    const tbody = document.getElementById('users-body');
    tbody.innerHTML = '<tr><td colspan="5" class="empty">Loading...</td></tr>';
    try {
      const r = await fetch(`/admin/api/users?page=${page}&limit=20&search=${encodeURIComponent(search)}`);
      const users = await r.json();

      if (!users.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty">No users found.</td></tr>';
        return;
      }

      tbody.innerHTML = users.map(u => {
        const name = [u.first_name, u.last_name].filter(Boolean).join(' ') || '<span class="text-muted">—</span>';
        const username = u.username ? `@${u.username}` : '<span class="text-muted">—</span>';
        const badge = `<span class="badge badge-${u.status}">${u.status}</span>`;

        let actions = '';
        if (u.status !== 'verified') actions += `<button class="btn btn-verify" onclick="action(${u.telegram_id},'verify')">Verify</button>`;
        if (u.status !== 'banned')   actions += `<button class="btn btn-ban"    onclick="action(${u.telegram_id},'ban')">Ban</button>`;
        if (u.status === 'banned')   actions += `<button class="btn btn-unban"  onclick="action(${u.telegram_id},'unban')">Unban</button>`;

        return `<tr>
          <td class="mono">${u.telegram_id}</td>
          <td>${name}</td>
          <td class="mono">${username}</td>
          <td>${badge}</td>
          <td><div class="actions">${actions}</div></td>
        </tr>`;
      }).join('');

      // Update last-updated time
      const now = new Date();
      document.getElementById('last-updated').textContent =
        `Updated ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;

    } catch(e) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty">Failed to load users.</td></tr>';
    }
  }

  async function action(telegramId, type) {
    try {
      const r = await fetch(`/admin/api/users/${telegramId}/${type}`, { method: 'POST' });
      const d = await r.json();
      if (d.ok) {
        showToast(`User ${telegramId} ${type}d`);
        loadAll();
      }
    } catch(e) {
      showToast('Action failed', true);
    }
  }

  function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = isError ? 'error' : '';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function loadAll() {
    const search = document.getElementById('search').value;
    loadStats();
    loadUsers(currentPage, search);
  }

  // Search with debounce
  document.getElementById('search').addEventListener('input', e => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      currentPage = 1;
      loadUsers(1, e.target.value);
    }, 350);
  });

  // Auto-refresh every 30 seconds
  setInterval(loadAll, 30000);

  // Initial load
  loadAll();
</script>
</body>
</html>
